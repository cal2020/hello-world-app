[project]
name = "ai-cost-inspector"
version = "0.1.0"
description = "Local inspector for AUDR agent-cost telemetry with evidence-backed optimization candidates."
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.142.2",
    "uvicorn~=0.54.0",
    "jsonschema~=4.26.0",
    "jinja2~=3.1.6",
    # KORA Doctor is installed unmodified from the upstream repository, pinned to the
    # v0.1.0 release commit. See ../THIRD_PARTY_NOTICES.md.
    "kora-doctor @ git+https://github.com/Krako-Labs/kora-doctor.git@7c54af8f1ddf891bfd05125fd1c345186c9cd62a",
]

[project.scripts]
cost-inspector = "cost_inspector.cli:main"

[dependency-groups]
dev = [
    "pytest~=9.1.1",
    "httpx2~=2.13.1",
    "ruff~=0.16.10",
    "mypy~=2.4.0",
    "types-jsonschema~=4.26.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cost_inspector"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "C4"]
ignore = [
    "S101",   # assert is fine in tests and for internal invariants
    "RUF001", # we intentionally use typographic characters (·, –, ≥) in user-facing text
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S607", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/cost_inspector"]

[[tool.mypy.overrides]]
module = ["kora_doctor", "kora_doctor.*"]
ignore_missing_imports = true
