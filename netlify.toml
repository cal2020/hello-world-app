# Netlify: every route is prerendered to its own index.html, so no SPA
# rewrite is needed; unknown paths get dist/404.html with a 404 status.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Set SITE_URL in the Netlify UI (e.g. https://cell-atlas.example.org) for
  # absolute canonical/hreflang URLs and sitemap.xml.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
