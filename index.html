<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04050a" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Human Cell Atlas</title>
    <!--app-head-->
    <script>
      // Hide the prerendered text page while the interactive atlas starts. If the
      // application has not mounted after 8 s (blocked or failed script), the
      // complete text page is shown instead. Without JavaScript this never runs.
      (function () {
        var root = document.documentElement;
        root.classList.add('js-pending');
        setTimeout(function () {
          if (!window.__HCA_MOUNTED__) root.classList.remove('js-pending');
        }, 8000);
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
