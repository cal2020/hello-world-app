[project]
name = "agenthorizon"
version = "0.1.0"
description = "Research-faithful AgentHorizon judging core, ingestion, scoring, and research workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pillow>=10.4",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
anthropic = ["anthropic>=0.40"]

[project.scripts]
agenthorizon = "agenthorizon.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenthorizon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
markers = [
    "reference: cross-checks that need the pinned authors' repository checkout",
    "postgres: tests that need a PostgreSQL server (auto-provisioned locally when binaries exist)",
    "isolation: tests that need Linux user/mount/net namespaces",
    "network: tests that need outbound network access",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
